<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="theme-color" content="#FAFAF8" />

    <link rel="icon" href="/favicon.ico" />
    <title>MCSManager Panel</title>

    <style>
      /* Loading */
      :root {
        --loading-accent: #ec4899;
        --loading-accent-strong: #db2777;
        --loading-text: #4b2940;
        --loading-surface: rgba(255, 244, 249, 0.2);
        --loading-border: rgba(255, 255, 255, 0.62);
        --ant-primary-color: #ec4899 !important;
        --ant-primary-color-hover: #db2777 !important;
        --ant-primary-color-active: #be185d !important;
        --ant-primary-color-outline: rgba(236, 72, 153, 0.2) !important;
        --ant-primary-1: rgba(236, 72, 153, 0.08) !important;
        --ant-primary-2: rgba(236, 72, 153, 0.15) !important;
        --ant-primary-3: rgba(236, 72, 153, 0.25) !important;
        --ant-primary-4: rgba(236, 72, 153, 0.35) !important;
        --ant-primary-5: rgba(236, 72, 153, 0.5) !important;
        --ant-primary-6: #ec4899 !important;
        --ant-primary-7: #db2777 !important;
        --ant-primary-8: #be185d !important;
        --ant-primary-9: #9d174d !important;
        --ant-primary-10: #831843 !important;
        --ant-info-color: #ec4899 !important;
        --ant-link-color: #db2777 !important;
      }

      html.loading-dark {
        --loading-accent: #b8a7db;
        --loading-accent-strong: #9b87c7;
        --loading-text: #eeeaf6;
        --loading-surface: rgba(18, 24, 42, 0.24);
        --loading-border: rgba(225, 216, 245, 0.26);
      }

      #before-app-mounted {
        background:
          linear-gradient(135deg, rgba(255, 225, 237, 0.12), rgba(90, 42, 70, 0.16)),
          url("./assets/anime-bg-light-e892d8c9.jpg") center / cover no-repeat;
        color: var(--loading-text);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #before-app-mounted::before,
      #before-app-mounted::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 999px;
        filter: blur(12px);
        opacity: 0.58;
        pointer-events: none;
      }

      #before-app-mounted::before {
        left: -110px;
        top: -90px;
        background: radial-gradient(circle, rgba(255, 150, 196, 0.34), transparent 66%);
      }

      #before-app-mounted::after {
        right: -120px;
        bottom: -120px;
        background: radial-gradient(circle, rgba(173, 116, 151, 0.22), transparent 68%);
      }

      #before-app-mounted .loading-box {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        width: 420px;
        height: 286px;
        justify-content: center;
        padding: 42px 52px;
        border-radius: 24px;
        background: var(--loading-surface);
        border: 1px solid var(--loading-border);
        box-shadow:
          0 30px 90px rgba(72, 28, 56, 0.2),
          0 8px 24px rgba(72, 28, 56, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.38);
        backdrop-filter: saturate(135%) blur(18px);
        -webkit-backdrop-filter: saturate(135%) blur(18px);
      }

      #before-app-mounted .loading-box::before {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.54);
        pointer-events: none;
      }

      #before-app-mounted .loading-brand {
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--loading-text);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #before-app-mounted .loading-brand::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--loading-accent), var(--loading-accent-strong));
        box-shadow: 0 0 18px rgba(236, 72, 153, 0.3);
      }

      #before-app-mounted .loading-ring {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background:
          conic-gradient(from 0deg, var(--loading-accent-strong) 0deg, var(--loading-accent) 110deg, rgba(255, 255, 255, 0.18) 230deg, var(--loading-accent-strong) 360deg);
        animation: ring-spin 1.5s cubic-bezier(0.4,0,0.2,1) infinite;
        box-shadow: 0 16px 38px rgba(99, 45, 80, 0.18);
        -webkit-mask: radial-gradient(circle, transparent 56%, #000 57%);
        mask: radial-gradient(circle, transparent 56%, #000 57%);
      }

      @keyframes ring-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #before-app-mounted .loading-label {
        margin-top: 24px;
        font-size: 15px;
        font-weight: 600;
        color: var(--loading-text);
        letter-spacing: 0.06em;
        animation: label-pulse 2s ease-in-out infinite;
      }

      @keyframes label-pulse {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }

      #before-app-mounted .loading-error {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 420px;
        min-height: 286px;
        box-sizing: border-box;
        justify-content: center;
        padding: 34px 40px;
        background: var(--loading-surface);
        border: 1px solid var(--loading-border);
        border-radius: 20px;
        backdrop-filter: saturate(135%) blur(18px);
        -webkit-backdrop-filter: saturate(135%) blur(18px);
        box-shadow: 0 22px 56px rgba(66,52,34,0.14);
      }

      #before-app-mounted .loading-error.show {
        display: flex;
      }

      #before-app-mounted .error-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--loading-text);
      }

      @media (max-width: 520px) {
        #before-app-mounted .loading-box,
        #before-app-mounted .loading-error {
          width: calc(100vw - 40px);
          height: 260px;
          min-height: 260px;
          padding: 32px 26px;
        }

        #before-app-mounted .loading-ring {
          width: 64px;
          height: 64px;
        }
      }

      #before-app-mounted .error-message {
        font-size: 14px;
        line-height: 1.6;
        color: var(--loading-text);
        margin-bottom: 24px;
        text-align: center;
        word-break: break-word;
      }

      #before-app-mounted .error-button {
        padding: 10px 28px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, var(--loading-accent), var(--loading-accent-strong));
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        outline: none;
      }

      #before-app-mounted .error-button:hover {
        background: linear-gradient(135deg, var(--loading-accent-strong), var(--loading-accent));
        box-shadow: 0 4px 14px rgba(236, 72, 153, 0.28);
      }

      html.loading-dark #before-app-mounted {
        background:
          linear-gradient(135deg, rgba(4, 9, 24, 0.34), rgba(22, 15, 43, 0.28)),
          url("./assets/anime-bg-dark-d40ad605.jpg") center / cover no-repeat;
      }

      html.loading-dark #before-app-mounted::before {
        background: radial-gradient(circle, rgba(184, 167, 219, 0.26), transparent 66%);
      }

      html.loading-dark #before-app-mounted::after {
        background: radial-gradient(circle, rgba(217, 141, 184, 0.2), transparent 68%);
      }

      @media (max-width: 520px) {
        #before-app-mounted {
          padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
          box-sizing: border-box;
        }
      }

      /* 应用主题由 src/assets 下的双主题样式统一管理；这里只保留挂载前加载界面。 */
    </style>

    <script>
      (function () {
        try {
          var theme = Number(localStorage.getItem("THEME_KEY"));
          var dark = theme === 2 || (theme === 0 && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("loading-dark", dark);
        } catch (_) {}
      })();
    </script>

    <script>
      (function (window) {
        window.closeLoadingContainer = function () {
          document.getElementById("before-app-mounted").setAttribute("style", "display:none");
        };

        window.setLoadingTitle = function (title) {
          document
            .getElementById("before-app-mounted")
            .querySelector(".loading-label").textContent = title;
        };

        window.setAppLoadingError = function (error) {
          var container = document.getElementById("before-app-mounted");
          var loadingBox = container.querySelector(".loading-box");
          var errorBox = container.querySelector(".loading-error");
          var errorMessage = errorBox.querySelector(".error-message");
          var ring = loadingBox.querySelector(".loading-ring");
          var label = loadingBox.querySelector(".loading-label");
          if (ring) ring.style.display = "none";
          if (label) label.style.display = "none";
          errorMessage.textContent = error;
          errorBox.classList.add("show");
        };
      })(window);
    </script>
  </head>
  <body>
    <div id="before-app-mounted">
      <noscript>You need to enable JavaScript to run this Website.</noscript>
      <div class="loading-box">
        <div class="loading-brand">MCSManager</div>
        <div class="loading-ring"></div>
        <div class="loading-label">Loading...</div>
        <div class="loading-error">
          <div class="error-title">Error</div>
          <div class="error-message"></div>
          <button class="error-button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <div id="app-mount-point" style="width: 100vw; overflow: auto"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
