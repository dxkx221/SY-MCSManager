<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="theme-color" content="#060B14" />

    <link rel="icon" href="/favicon.ico" />
    <title>MCSManager Panel</title>

    <style>
      /* ═══ Loading Screen ═══ */
      :root {
        --loading-bg: #F6F9FD;
        --loading-accent: #2563EB;
      }

      #before-app-mounted {
        background: radial-gradient(circle at 50% 40%, rgba(37,99,235,0.04) 0%, rgba(37,99,235,0.01) 40%, #F6F9FD 100%);
        color: #111827;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      #before-app-mounted .loading-box {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #before-app-mounted .loading-ring {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #2563EB 0deg, #0EA5E9 120deg, transparent 240deg, #2563EB 360deg);
        animation: ring-spin 1.4s cubic-bezier(0.4,0,0.2,1) infinite;
        -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%);
        mask: radial-gradient(circle, transparent 55%, #000 56%);
      }

      @keyframes ring-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #before-app-mounted .loading-label {
        margin-top: 22px;
        font-size: 15px;
        font-weight: 500;
        color: #475569;
        letter-spacing: 0.5px;
        animation: label-pulse 2s ease-in-out infinite;
      }

      @keyframes label-pulse {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }

      #before-app-mounted .loading-error {
        display: none;
        flex-direction: column;
        align-items: center;
        max-width: 420px;
        padding: 28px 32px;
        background: #FFFFFF;
        border: 1px solid #D8E3F2;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(15,23,42,0.06);
      }

      #before-app-mounted .loading-error.show {
        display: flex;
      }

      #before-app-mounted .error-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #111827;
      }

      #before-app-mounted .error-message {
        font-size: 14px;
        line-height: 1.6;
        color: #64748B;
        margin-bottom: 24px;
        text-align: center;
        word-break: break-word;
      }

      #before-app-mounted .error-button {
        padding: 10px 28px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #2563EB;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        outline: none;
      }

      #before-app-mounted .error-button:hover {
        background: #1d4ed8;
        box-shadow: 0 4px 14px rgba(37,99,235,0.3);
      }

      /* ═══ Guaranteed Sidebar Styles (inline to bypass Vite CSS chunking) ═══ */
      .left-sidebar {
        display: flex !important;
        flex-direction: column !important;
        flex: 0 0 220px !important;
        width: 220px !important;
        text-align: left !important;
        background: #060B14 !important;
        border-right: 1px solid rgba(255,255,255,0.04) !important;
        padding: 20px 10px !important;
        transition: width 0.22s ease !important;
        overflow: hidden !important;
      }

      .left-sidebar:hover {
        width: 236px !important;
      }

      .left-sidebar .logo {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        height: 44px;
        padding: 0 10px 22px;
        flex-shrink: 0;
      }

      .left-sidebar .logo img {
        max-width: 144px;
        max-height: 30px;
        object-fit: contain;
      }

      .left-sidebar .sidebar-menu {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 4px 4px;
        flex: 1;
        gap: 2px;
        width: 100%;
        overflow-y: auto;
        color: #8895A7;
        font-size: 13.5px;
      }

      .left-sidebar .sidebar-item {
        display: flex !important;
        align-items: center !important;
        gap: 10px !important;
        padding: 9px 12px !important;
        color: #8895A7 !important;
        text-decoration: none !important;
        cursor: pointer !important;
        border-radius: 8px !important;
        transition: all 0.16s ease !important;
        width: 100% !important;
        font-weight: 450 !important;
        font-size: 13.5px !important;
        white-space: nowrap !important;
        background: transparent !important;
      }

      .left-sidebar .sidebar-item:hover {
        color: #D1D5DB !important;
        background: rgba(255,255,255,0.04) !important;
      }

      .left-sidebar .sidebar-item.sidebar-item-active {
        color: #FFFFFF !important;
        background: rgba(37,99,235,0.12) !important;
        box-shadow: inset 3px 0 0 #3B82F6 !important;
      }

      .left-sidebar .sidebar-item-icon {
        font-size: 16px;
        flex-shrink: 0;
        color: inherit !important;
      }

      .left-sidebar .sidebar-item-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .left-sidebar .sidebar-divider {
        height: 1px;
        background: rgba(255,255,255,0.05);
        margin: 6px 0;
        flex-shrink: 0;
        width: 100%;
      }
    </style>

    <script>
      (function (window) {
        window.closeLoadingContainer = function () {
          document.getElementById("before-app-mounted").setAttribute("style", "display:none");
        };

        window.setLoadingTitle = function (title) {
          document
            .getElementById("before-app-mounted")
            .querySelector(".loading-label").textContent = title;
        };

        window.setAppLoadingError = function (error) {
          var container = document.getElementById("before-app-mounted");
          var loadingBox = container.querySelector(".loading-box");
          var errorBox = container.querySelector(".loading-error");
          var errorMessage = errorBox.querySelector(".error-message");
          var ring = loadingBox.querySelector(".loading-ring");
          var label = loadingBox.querySelector(".loading-label");
          if (ring) ring.style.display = "none";
          if (label) label.style.display = "none";
          errorMessage.textContent = error;
          errorBox.classList.add("show");
        };
      })(window);
    </script>
  </head>
  <body>
    <div id="before-app-mounted">
      <noscript>You need to enable JavaScript to run this Website.</noscript>
      <div class="loading-box">
        <div class="loading-ring"></div>
        <div class="loading-label">Loading...</div>
        <div class="loading-error">
          <div class="error-title">Error</div>
          <div class="error-message"></div>
          <button class="error-button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <div id="app-mount-point" style="width: 100vw; overflow: auto"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
